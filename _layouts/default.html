<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:,">
</head>
<body>
  <div class="skip-link"><a href="#main">Skip to content</a></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">P</span>
        <span class="wordmark">Praniti Khurana</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/reading-list/' | relative_url }}">Reading List</a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>&copy; {{ 'now' | date: "%Y" }} Praniti Khurana</span>
      <a href="https://github.com/pranitidumb" target="_blank" rel="noopener">GitHub</a>
    </div>
  </footer>
</body>
</html>
