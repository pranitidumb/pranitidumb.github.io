<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:,">
</head>
<body>
  <div class="skip-link"><a href="#main">Skip to content</a></div>

  <header class="site-header">
    <div class="wrap site-header-inner">
      <a class="home-link" href="{{ '/' | relative_url }}">Home</a>
      <nav class="site-nav">
        <a href="{{ '/work/' | relative_url }}">Work</a>
        <a href="{{ '/personal-projects/' | relative_url }}">Personal Projects</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/reading-list/' | relative_url }}">Reading List</a>
        <a href="{{ '/resume/' | relative_url }}">Resume</a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <a href="#" target="_blank" rel="noopener">LinkedIn</a>
      <a href="#" target="_blank" rel="noopener">Twitter</a>
      <a href="mailto:your.email@example.com">Email</a>
    </div>
    <!-- swap the "#" hrefs for your real LinkedIn and Twitter URLs, and the mailto for your real email -->
  </footer>
</body>
</html>
